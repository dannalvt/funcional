<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funcional</title>
<style>
:root{--bg:#0f1012;--card:#191a1d;--line:#2a2c31;--ink:#f4f2ee;--mid:#b9b6ae;--acc:#ff5a7a;--acc2:#ffd166;--ok:#5ad19a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:30px;margin:0;letter-spacing:-.5px}
.sub{color:var(--mid);margin:4px 0 18px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--mid);border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.tab.on{background:var(--acc);border-color:var(--acc);color:#1a0a0e}
.list{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.ex.sel{border-color:var(--acc)}
.ex .n{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.ex.done .n{background:var(--ok);color:#06241a}
.ex b{display:block}.ex small{color:var(--mid)}
.player{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vid{aspect-ratio:16/9;background:#000}
.vid iframe{width:100%;height:100%;border:0;display:block}
.info{padding:16px}
.info h2{margin:0 0 4px;font-size:22px}
.tag{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2);margin-bottom:6px}
ul.cues{margin:10px 0 0;padding-left:18px;color:var(--mid)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--line);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
button.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a0a0e}
a.yt{color:var(--mid);font-size:14px}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.timer{margin-top:16px;padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:center}
.timer .t{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer .ph{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.timer.work .t{color:var(--acc)}.timer.rest .t{color:var(--ok)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.cfg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--mid);font-size:14px;align-items:center}
.cfg input{width:64px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.prog{color:var(--mid);font-size:14px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Funcional</h1>
  <p class="sub">Dos bloques, diez ejercicios. Toca uno para ver el video o dale a "Circuito" para que te guíe con el cronómetro.</p>
  <div class="grid">
    <div>
      <div class="tabs" id="tabs"></div>
      <div class="prog" id="prog"></div>
      <div class="list" id="list"></div>
    </div>
    <div class="player">
      <div class="vid" id="vid"></div>
      <div class="info">
        <span class="tag" id="tag"></span>
        <h2 id="name"></h2>
        <div id="desc" style="color:var(--mid)"></div>
        <ul class="cues" id="cues"></ul>
        <div class="row">
          <button class="btn pri" id="go">Circuito completo</button>
          <button class="btn" id="one">Solo este (cronómetro)</button>
          <button class="btn" id="mark">Marcar hecho</button>
          <a class="yt" id="yt" target="_blank" rel="noopener">Abrir en YouTube</a>
        </div>
        <div class="cfg">
          <label>Trabajo <input id="wk" type="number" min="10" max="120" value="40"> s</label>
          <label>Descanso <input id="rs" type="number" min="5" max="90" value="20"> s</label>
        </div>
        <div class="timer" id="timer" hidden>
          <div class="ph" id="ph"></div>
          <div class="t" id="tt">0</div>
          <div class="bar"><i id="pb"></i></div>
          <div class="row" style="justify-content:center">
            <button class="btn" id="pause">Pausa</button>
            <button class="btn" id="skip">Saltar</button>
            <button class="btn" id="stop">Terminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const BLOCKS=[
 {k:'A',title:'Bloque A · Locomoción',items:[
  {n:'Bear crawl',v:'vg5hegN6pk0',d:'Gateo de oso hacia adelante, rodillas a un palmo del piso.',c:['Muñecas bajo los hombros','Rodillas flotando, espalda plana','Mano y pie contrarios avanzan juntos']},
  {n:'Lateral bear crawl',v:'he1k9F-P4DI',d:'El mismo gateo pero de lado.',c:['Mueve mano y pie del mismo lado','Caderas bajas y estables','Cambia de dirección a mitad de tiempo']},
  {n:'Crab walk',v:'VTzvPeBCzuw',d:'Cangrejo: pecho arriba, caderas elevadas.',c:['Manos atrás, dedos hacia los pies','Aprieta glúteos y mantén caderas arriba','Camina adelante y atrás']},
  {n:'Sit-through',v:'J1Z6h-Y4ASo',d:'Desde cuatro apoyos, pasa una pierna por debajo y rota el torso.',c:['Mira hacia el lado que rotas','Caderas altas al pasar','Alterna lados']},
  {n:'Beast shoulder taps',v:'y3jJ7ddjnoA',d:'Posición bestia (rodillas a 2 cm del piso) tocando el hombro.',c:['Rodillas bajo las caderas','No dejes que la cadera se mueva','Toca lento y controlado']}]},
 {k:'B',title:'Bloque B · Core dinámico',items:[
  {n:'Inchworm',v:'aFkv2m9FTGs',d:'De pie, camina con las manos hasta plancha y vuelve.',c:['Piernas lo más rectas posible','Plancha firme arriba','Camina los pies hacia las manos']},
  {n:'Cross-body knee drive',v:'O4fFIYpYySU',d:'En plancha, lleva la rodilla hacia el codo contrario.',c:['Hombros sobre muñecas','Rota el torso al subir la rodilla','Sin hundir la cadera']},
  {n:'Plank rotation',v:'t6PGLPsZnJU',d:'De plancha a plancha lateral, brazo al techo.',c:['Pies anchos para estabilidad','Sigue la mano con la mirada','Vuelve al centro con control']},
  {n:'Mountain climber cruzado',v:'1cwZ8VZvRjc',d:'Escalador llevando la rodilla al codo contrario.',c:['Ritmo constante','Caderas bajas','Exhala en cada rodilla']},
  {n:'Sprawl',v:'UFFODmd6RTc',d:'Como burpee sin salto: manos al piso, patadas atrás y vuelta.',c:['Cadera baja al caer','Pecho cerca del piso','Levántate explosiva']}]}
];
const ALL=BLOCKS.flatMap(b=>b.items.map(i=>({...i,k:b.k,bt:b.title})));
let sel=0,tab='A',done={};
try{done=JSON.parse(localStorage.getItem('func-done')||'{}')}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('func-done',JSON.stringify(done))}catch(e){}}
function renderTabs(){
  $('tabs').innerHTML='';
  BLOCKS.forEach(b=>{const t=document.createElement('button');t.className='tab'+(tab===b.k?' on':'');t.textContent='Bloque '+b.k;
    t.onclick=()=>{tab=b.k;renderTabs();renderList()};$('tabs').appendChild(t)});
}
function renderList(){
  const b=BLOCKS.find(x=>x.k===tab);
  $('list').innerHTML='';
  b.items.forEach(it=>{
    const idx=ALL.findIndex(a=>a.n===it.n);
    const el=document.createElement('button');
    el.className='ex'+(idx===sel?' sel':'')+(done[it.n]?' done':'');
    el.innerHTML='<span class="n">'+(done[it.n]?'✓':(idx%5)+1)+'</span><span><b>'+it.n+'</b><small>'+it.d+'</small></span>';
    el.onclick=()=>{stopTimer();show(idx)};
    $('list').appendChild(el);
  });
  $('prog').textContent=Object.values(done).filter(Boolean).length+' de '+ALL.length+' ejercicios hechos hoy';
}
function show(i,autoplay){
  sel=i;const e=ALL[i];tab=e.k;
  $('vid').innerHTML='<iframe src="https://www.youtube.com/embed/'+e.v+'?rel=0&playsinline=1&mute=1&loop=1&playlist='+e.v+(autoplay?'&autoplay=1':'')+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  $('tag').textContent=e.bt;$('name').textContent=e.n;$('desc').textContent=e.d;
  $('cues').innerHTML=e.c.map(x=>'<li>'+x+'</li>').join('');
  $('yt').href='https://www.youtube.com/watch?v='+e.v;
  $('go').textContent='Circuito desde aquí';
  $('mark').textContent=done[e.n]?'Quitar hecho':'Marcar hecho';
  renderTabs();renderList();
}
$('mark').onclick=()=>{const n=ALL[sel].n;done[n]=!done[n];save();show(sel)};
/* cronometro */
let st=null,ac=null;
function beep(f,ms){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000)}catch(e){}}
function stopTimer(){if(st&&st.h)clearInterval(st.h);st=null;$('timer').hidden=true}
function startTimer(circuit){
  stopTimer();
  const W=+$('wk').value||40,R=+$('rs').value||20;
  st={circuit,phase:'work',left:W,total:W,W,R,paused:false};
  $('timer').hidden=false;$('pause').textContent='Pausa';
  show(sel,true);beep(880,250);draw();
  st.h=setInterval(tick,1000);
}
function draw(){
  if(!st)return;
  $('timer').className='timer '+st.phase;
  $('ph').textContent=st.phase==='work'?'Trabajo · '+ALL[sel].n:(st.circuit?'Descanso · sigue: '+ALL[Math.min(sel+1,ALL.length-1)].n:'Descanso');
  $('tt').textContent=st.left;
  $('pb').style.width=(100*(st.total-st.left)/st.total)+'%';
}
function tick(){
  if(!st||st.paused)return;
  st.left--;
  if(st.left<=3&&st.left>0)beep(660,120);
  if(st.left<=0){
    if(st.phase==='work'){
      done[ALL[sel].n]=true;save();
      if(st.circuit&&sel<ALL.length-1){st.phase='rest';st.left=st.total=st.R;beep(440,300);renderList()}
      else{finish();return}
    }else{
      st.phase='work';st.left=st.total=st.W;beep(880,250);show(sel+1,true);
    }
  }
  draw();
}
function finish(){
  const h=st&&st.h;if(h)clearInterval(h);st=null;
  $('timer').hidden=false;$('timer').className='timer';
  $('ph').textContent='Listo';$('tt').textContent='🎉';$('pb').style.width='100%';
  beep(988,500);renderList();
}
$('go').onclick=()=>startTimer(true);
$('one').onclick=()=>startTimer(false);
$('pause').onclick=()=>{if(!st)return;st.paused=!st.paused;$('pause').textContent=st.paused?'Seguir':'Pausa'};
$('skip').onclick=()=>{if(!st)return;st.left=1;tick()};
$('stop').onclick=stopTimer;
show(0);
</script>
</body>
</html>
